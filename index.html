<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neom987 · 项目导航</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card-hover: #1c2330;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
    }

    .hero {
      text-align: center;
      margin-bottom: 50px;
      width: 100%;
      max-width: 900px;
    }

    .avatar-ring {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: var(--bg);
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      box-shadow: 0 0 30px rgba(88, 166, 255, 0.3);
    }

    .hero h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hero h1 a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .hero h1 a:hover { color: var(--accent); }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #58a6ff, #bc8cff);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: #484f58;
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .card:hover::before { transform: scaleX(1); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-lang {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--accent);
      font-weight: 500;
      white-space: nowrap;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .card-link {
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: gap 0.2s;
    }

    .card:hover .card-link { gap: 9px; }

    .card-stars {
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer {
      margin-top: 50px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 40px 16px 30px; }
    }
  </style>
</head>
<body>

    <div class="avatar-ring">N</div>

  </div>

    <a class="card" href="https://neom987.github.io/warmup-cards/" target="_blank">

      </div>

      </div>
      <p class="card-desc">生物化学相关项目页面</p>
      <div class="card-footer">
        <span class="card-link">访问页面 →</span>

      </div>
    </a>

    <a class="card" href="https://neom987.github.io/car--/" target="_blank">

    <a class="card" href="https://neom987.github.io/Live-Sync/" target="_blank">

  <div class="footer">
    <p>© 2026 Neom987 · <a href="https://github.com/Neom987" target="_blank">github.com/Neom987</a></p>
  </div>

</body>
</html>
